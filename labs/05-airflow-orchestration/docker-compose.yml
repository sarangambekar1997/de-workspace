# Airflow in one container (`airflow standalone`: API server, scheduler, DAG processor, triggerer)
# plus Postgres for Airflow's metadata. Good for learning; not a production deployment.
name: lab05

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lab05-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow           # local lab only; never commit real credentials
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    image: lab05-airflow
    container_name: lab05-airflow
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"    # no login page (local lab only)
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"           # pick up new DAG files quickly
      LAB_DATA_DIR: /opt/lab/data
      LAB_WAREHOUSE_DIR: /opt/lab/warehouse
    volumes:
      - ./dags:/opt/airflow/dags
      - ../data:/opt/lab/data:ro                               # the dataset generator
      - ./warehouse:/opt/lab/warehouse                         # landing files and shop.duckdb
    # Create the single-slot pool that serializes DuckDB writers, then start everything
    command: >
      bash -c "airflow db migrate > /dev/null &&
               airflow pools set duckdb 1 'DuckDB allows one writer at a time' &&
               exec airflow standalone"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
